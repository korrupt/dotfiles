unbind r
bind r source-file ~/.tmux.conf

set -g @catppuccin_flavor 'mocha'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'amosblomqvist/pi-interactive-subagents'

# rename with ,
set-option -g allow-rename off

set -g prefix C-a
set -g mouse on
set -g renumber-windows on
set -g set-clipboard external
# Ptyxis (VTE) ignores OSC 52, so pipe copies to the Wayland clipboard directly
set -g copy-command 'wl-copy'
set -g extended-keys on
set -g extended-keys-format csi-u

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D


# catppuccin — manual install, loaded directly (not via tpm)
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

run '~/.tmux/plugins/tpm/tpm'

# --- status line (must come AFTER catppuccin loads) ---
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g default-shell /bin/zsh
set -g @catppuccin_window_status_style "rounded"
